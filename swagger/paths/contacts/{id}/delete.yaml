tags:
  - Contacts
summary: Delete contact by id
operationId: deleteContact
description: Delete a contact by its ID. Requires authentication
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      example: 65ca67e7ae7f10c88b598384

responses:
  '200':
    description: Contact successfully deleted
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact with id 65ca67e7ae7f10c88b598384 deleted successfully!
  '401':
    $ref: ../../../components/responses/401.yaml
  '403':
    $ref: ../../../components/responses/403.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
  '500':
    $ref: ../../../components/responses/500.yaml

